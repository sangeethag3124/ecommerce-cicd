apiVersion: apps/v1
kind: Deployment

metadata:
  name: ecommerce-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: ecommerce

  template:
    metadata:
      labels:
        app: ecommerce

    spec:
      containers:
      - name: ecommerce

        image: us-central1-docker.pkg.dev/poetic-primer-497409-i6/ecommerce-repo/ecommerce-app:v1

        ports:
        - containerPort: 5000
