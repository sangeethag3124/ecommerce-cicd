
steps:
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'us-central1-docker.pkg.dev/poetic-primer-497409-i6/ecommerce-repo/ecommerce-app:$SHORT_SHA', '.']

- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'us-central1-docker.pkg.dev/poetic-primer-497409-i6/ecommerce-repo/ecommerce-app:$SHORT_SHA']

- name: 'gcr.io/cloud-builders/kubectl'
  args:
  - 'set'
  - 'image'
  - 'deployment/ecommerce-app'
  - 'ecommerce=us-central1-docker.pkg.dev/poetic-primer-497409-i6/ecommerce-repo/ecommerce-app:$SHORT_SHA'
  env:
  - 'CLOUDSDK_COMPUTE_ZONE=us-central1-a'
  - 'CLOUDSDK_CONTAINER_CLUSTER=ecommerce-cluster'
